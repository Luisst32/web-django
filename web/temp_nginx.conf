server {
    if ($host = www.milanesa.sbs) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = milanesa.sbs) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name milanesa.sbs www.milanesa.sbs;
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;




}

server {
    listen 443 ssl;
    server_name milanesa.sbs www.milanesa.sbs;
    ssl_certificate /etc/letsencrypt/live/milanesa.sbs/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/milanesa.sbs/privkey.pem; # managed by Certbot

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    
    location /media/ {
        alias /home/ubuntu/web-django/web/media/;
        access_log off;
        expires max;
    }

    location /static/ {
        alias /home/ubuntu/web-django/web/staticfiles/;
        access_log off;
        expires max;
    }

    location / {

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }


}
