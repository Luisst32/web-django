{% load static %}
<!-- ============================================================ -->
<!-- CALL UI — Overlay de Llamada de Audio                        -->
<!-- ============================================================ -->

<!-- 1. Overlay: Llamada Entrante -->
<div id="incoming-call-overlay" style="
    display: none;
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 300px;
    background: rgba(20,20,30,0.97);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    z-index: 999999;
    padding: 22px 20px;
    color: white;
    animation: slideInCall 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
">
    <div class="d-flex align-items-center mb-3 gap-3">
        <div style="width:52px;height:52px;border-radius:50%;overflow:hidden;border:2.5px solid #22c55e;flex-shrink:0;background:#333;display:flex;align-items:center;justify-content:center;">
            <img id="incoming-caller-photo" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
            <i id="incoming-caller-icon" class="fas fa-user" style="font-size:1.3rem;color:#aaa;"></i>
        </div>
        <div>
            <div id="incoming-caller-name" style="font-weight:700;font-size:1rem;"></div>
            <div style="font-size:0.78rem;color:#a0a0b0;margin-top:2px;">
                <i class="fas fa-phone-alt" style="font-size:0.7rem;margin-right:4px;"></i>Llamada entrante...
            </div>
        </div>
    </div>
    <div class="d-flex gap-3 justify-content-center mt-2">
        <button onclick="rejectCall()" style="
            width:52px;height:52px;border-radius:50%;border:none;
            background:#ef4444;color:white;font-size:1.2rem;
            cursor:pointer;transition:transform 0.15s;box-shadow:0 4px 15px rgba(239,68,68,0.4);
        " title="Rechazar">
            <i class="fas fa-phone-slash"></i>
        </button>
        <button onclick="acceptCall()" style="
            width:52px;height:52px;border-radius:50%;border:none;
            background:#22c55e;color:white;font-size:1.2rem;
            cursor:pointer;transition:transform 0.15s;box-shadow:0 4px 15px rgba(34,197,94,0.4);
        " title="Aceptar llamada">
            <i class="fas fa-phone-alt"></i>
        </button>
    </div>
</div>

<!-- 2. Overlay: Llamada de Audio Activa -->
<div id="active-call-overlay" style="
    display: none;
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 300px;
    background: rgba(20,20,30,0.97);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    z-index: 999999;
    padding: 28px 20px 22px;
    color: white;
    text-align: center;
    animation: slideInCall 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
">
    <!-- Avatar -->
    <div style="margin: 0 auto 14px;width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,0.25);background:#333;display:flex;align-items:center;justify-content:center;">
        <img id="call-peer-photo" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
        <i id="call-peer-icon" class="fas fa-user" style="font-size:2rem;color:#aaa;"></i>
    </div>

    <div id="call-peer-name" style="font-weight:700;font-size:1.05rem;margin-bottom:4px;"></div>
    <div id="call-status-label" style="font-size:0.8rem;color:rgba(255,255,255,0.55);margin-bottom:6px;">Conectando...</div>
    <div id="call-timer" style="font-size:1rem;font-family:monospace;color:#22c55e;font-weight:600;min-height:22px;"></div>

    <!-- Controles -->
    <div class="d-flex gap-3 justify-content-center mt-4">
        <!-- Silencio -->
        <button id="btn-mute" onclick="toggleMute()" style="
            width:48px;height:48px;border-radius:50%;border:none;
            background:rgba(255,255,255,0.12);color:white;font-size:1rem;
            cursor:pointer;transition:background 0.2s;
        " title="Silenciar">
            <i class="fas fa-microphone" id="mute-icon"></i>
        </button>

        <!-- Colgar -->
        <button onclick="endCall()" style="
            width:58px;height:58px;border-radius:50%;border:none;
            background:#ef4444;color:white;font-size:1.3rem;
            cursor:pointer;box-shadow:0 4px 20px rgba(239,68,68,0.5);
            transition:transform 0.15s;
        " title="Colgar">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>
</div>

<!-- Audio remoto (oculto, solo reproduce el audio de la llamada) -->
<audio id="remote-audio" autoplay></audio>

<!-- Ringtone de llamada entrante -->
<audio id="call-ringtone" loop src="{% static 'song/dragon-studio-new-notification-3-398649.mp3' %}"></audio>

<style>
@keyframes slideInCall {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
}
.draggable-call {
    cursor: grab;
    user-select: none;
}
.draggable-call:active {
    cursor: grabbing;
}
</style>

<script>
    // Hacer que los overlays de llamada sean arrastrables
    function makeDraggable(elementId) {
        const elmnt = document.getElementById(elementId);
        if (!elmnt) return;
        
        elmnt.classList.add('draggable-call');

        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            // No arrastrar si se hace clic en botones
            if (e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
            e = e || window.event;
            // Solo prevenir default si no es un input o un botón
            if(e.target.tagName.toLowerCase() !== 'input' && e.target.tagName.toLowerCase() !== 'textarea') {
                e.preventDefault();
            }
            
            // Si el elemento aún usa bottom/right, lo convertimos a top/left absoluto antes de empezar a mover
            if (elmnt.style.bottom !== 'auto') {
                elmnt.style.top = elmnt.offsetTop + "px";
                elmnt.style.left = elmnt.offsetLeft + "px";
                elmnt.style.bottom = 'auto';
                elmnt.style.right = 'auto';
            }

            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function dragTouchStart(e) {
            if (e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
            
            if (elmnt.style.bottom !== 'auto') {
                elmnt.style.top = elmnt.offsetTop + "px";
                elmnt.style.left = elmnt.offsetLeft + "px";
                elmnt.style.bottom = 'auto';
                elmnt.style.right = 'auto';
            }

            const touch = e.touches[0];
            pos3 = touch.clientX;
            pos4 = touch.clientY;
            document.ontouchend = closeDragElement;
            document.ontouchmove = elementDragTouch;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            // set the element's new position:
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function elementDragTouch(e) {
            const touch = e.touches[0];
            pos1 = pos3 - touch.clientX;
            pos2 = pos4 - touch.clientY;
            pos3 = touch.clientX;
            pos4 = touch.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }

    // Llamar inmediatamente porque el script está debajo de los elementos
    makeDraggable('incoming-call-overlay');
    makeDraggable('active-call-overlay');

    // También reintentar por si se carga después (como con HTMX u otros métodos asíncronos)
    document.addEventListener("DOMContentLoaded", function() {
        makeDraggable('incoming-call-overlay');
        makeDraggable('active-call-overlay');
    });
    
    // Si se inyecta con HTMX
    document.body.addEventListener('htmx:afterSwap', function() {
        makeDraggable('incoming-call-overlay');
        makeDraggable('active-call-overlay');
    });
</script>
