{% load static %}
{% include 'chat/call_ui.html' %}
<!-- MESSAGE PANEL (Floating Bottom-Right) -->
<div id="message-panel" class="message-panel">
    <div class="message-header" onclick="toggleMinimize()" style="cursor: pointer;">
        <div class="d-flex flex-column" style="display: none !important;">
            <span id="chat-title" class="fw-bold">Mensajes</span>
            <small id="chat-status" class="text-muted" style="font-size: 0.7rem; line-height: 1;"></small>
        </div>
        <input type="hidden" id="current-user-id" value="{{ request.user.id }}">
        <div class="header-actions">
            <!-- Minimize Button -->
            <button class="header-btn" title="Minimizar" onclick="event.stopPropagation(); minimizePanel()">
                <i class="fas fa-minus"></i>
            </button>
            <!-- Close Button -->
            <button class="header-btn" title="Cerrar" onclick="event.stopPropagation(); closePanel()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <div id="chat-content-area" class="message-content h-100" hx-get="{% url 'load_chat_panel' %}"
        hx-trigger="intersect once" style="display: flex; flex-direction: column; min-height: 0;">
        <div class="d-flex justify-content-center align-items-center flex-grow-1">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    </div>
</div>

<!-- CHAT COMPACT TRIGGER -->
<div id="chat-compact-trigger" class="chat-compact-trigger hidden" onclick="toggleMessagePanel()">
    <div class="d-flex align-items-center justify-content-center h-100">
        <i class="fas fa-comment-dots me-2" style="color: #0084ff;"></i>
        <span class="fw-bold text-dark">Chat</span>
    </div>
</div>

<style>
    /* --- Message Panel Styles --- */
    .message-panel {
        position: fixed;
        bottom: -100%;
        right: 20px;
        width: 650px;
        /* Widened for desktop-like feel */
        height: 500px;
        /* Slightly taller */
        max-height: 85vh;
        /* Safety for small screens */
        background: white;
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.15);
        z-index: 2050;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
    }

    .message-panel.active {
        bottom: 0;
        visibility: visible;
        opacity: 1;
    }

    .message-panel.minimized {
        bottom: -435px;
        /* Adjust based on header height */
    }

    /* --- Compact Trigger Styles --- */
    .chat-compact-trigger {
        position: fixed;
        bottom: 0;
        right: 30px;
        width: 130px;
        height: 45px;
        background: white;
        border-radius: 15px 15px 0 0;
        box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        z-index: 2045;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid #f0f0f0;
        border-bottom: none;
        display: block;
    }

    .chat-compact-trigger:hover {
        transform: translateY(-2px);
        box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.15);
    }

    .chat-compact-trigger.hidden {
        transform: translateY(100%);
        pointer-events: none;
        opacity: 0;
    }

    .message-header {
        background: #fff;
        border-bottom: 1px solid #f0f0f0;
        padding: 12px 15px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        color: #1f2937;
    }

    .header-actions {
        display: flex;
        gap: 8px;
    }

    .header-btn {
        background: none;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        transition: all 0.2s;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
    }

    .header-btn:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .message-content {
        flex: 1;
        background: #fff;
        overflow: hidden;
        /* Prevent content from growing panel */
        display: flex;
        flex-direction: column;
    }

    .cursor-pointer {
        cursor: pointer;
    }
</style>

<script>
    let chatSocket = null;
    let activeChatSocketId = null;
    let presenceSocket = null;
    const presenceTimers = {}; // To manage timeouts
    const presenceCache = {}; // Cache of {userId: 'online'|'offline'} for when DOM loads later
    const currentUserId = parseInt("{{ request.user.id }}".trim());
    console.log("Current User ID initialized:", currentUserId);

    // ---- TIMEZONE FORMATTING ----
    function formatLocalTime() {
        document.querySelectorAll('.local-time').forEach(el => {
            if (el.dataset.utc && !el.dataset.formatted) {
                let utcStr = el.dataset.utc;
                if (!utcStr.endsWith('Z')) utcStr += 'Z'; // ensure UTC
                let d = new Date(utcStr);
                if (!isNaN(d.getTime())) {
                    el.textContent = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    el.dataset.formatted = "true";
                }
            }
        });
    }

    document.body.addEventListener('htmx:afterSwap', function(e) {
        formatLocalTime();
    });

    // ---- PRESENCE POLLING (Fallback/Definitive source of truth) ----
    function fetchOnlineStatuses() {
        fetch("{% url 'online_status_api' %}")
            .then(res => res.json())
            .then(data => {
                if (data.statuses) {
                    console.log('[Presence API] Synced statuses:', data.statuses);
                    Object.entries(data.statuses).forEach(([userId, status]) => {
                        updateUserStatusInList(userId, status);
                    });
                }
            })
            .catch(err => console.error('[Presence API] Sync error:', err));
    }
    
    // Fetch immediately on load, then every 30 seconds
    fetchOnlineStatuses();
    setInterval(fetchOnlineStatuses, 30000);

    // ---- NAVBAR CHAT BADGE ----
    function incrementChatBadge() {
        const badge = document.getElementById('chat-badge');
        if (!badge) return;
        const current = parseInt(badge.textContent.trim()) || 0;
        badge.textContent = current + 1;
        badge.classList.remove('d-none');
    }

    function clearChatBadge() {
        const badge = document.getElementById('chat-badge');
        if (!badge) return;
        badge.textContent = '0';
        badge.classList.add('d-none');
    }
    // ---------------------------

    function toggleMessagePanel() {
        var panel = document.getElementById('message-panel');
        if (!panel) return;

        // Show panel and hide trigger (Active state)
        panel.classList.add('active');
        const trigger = document.getElementById('chat-compact-trigger');
        if (trigger) trigger.classList.add('hidden');

        // Limpiar badge del navbar al abrir el panel
        clearChatBadge();

        // Marcar como leídos los mensajes del chat activo cuando se abre el panel
        if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            chatSocket.send(JSON.stringify({ 'action': 'read_messages' }));
        }

        // Force scroll to bottom on re-open
        if (typeof window.scrollToBottom === 'function') {
            setTimeout(window.scrollToBottom, 100); // Small delay for animation
        }
    }

    function minimizePanel() {
        var panel = document.getElementById('message-panel');
        if (panel) panel.classList.remove('active');

        // Show compact trigger (Minimized state)
        const trigger = document.getElementById('chat-compact-trigger');
        if (trigger) trigger.classList.remove('hidden');
    }

    function closePanel() {
        var panel = document.getElementById('message-panel');
        if (panel) {
            panel.classList.remove('active');
            panel.classList.remove('minimized');
        }
        // Hide compact trigger too (Closed state)
        const trigger = document.getElementById('chat-compact-trigger');
        if (trigger) trigger.classList.add('hidden');
    }

    function toggleMinimize() {
        // From header click, we minimize to the tab
        minimizePanel();
    }

    // WebSocket logic (reused from before)
    let typingTimeout = null;

    function connectToPresence() {
        if (!document.getElementById('current-user-id')) return;
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/presence/`;
        presenceSocket = new WebSocket(wsUrl);

        presenceSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            if (data.type === 'presence_update') {
                updateUserStatusInList(data.user_id, data.status);
                
                // Clear any existing timer for this user
                if (presenceTimers[data.user_id]) {
                    clearTimeout(presenceTimers[data.user_id]);
                }
                
                // Set a 30-second timeout for testing. If no heartbeat is received, mark offline.
                if (data.status === 'online') {
                    presenceTimers[data.user_id] = setTimeout(() => {
                        updateUserStatusInList(data.user_id, 'offline');
                        
                        // Update header if we are chatting with them
                        if (window.currentChatOtherUserId && window.currentChatOtherUserId == data.user_id) {
                            const statusEl = document.getElementById('chat-status');
                            if (statusEl) {
                                statusEl.innerText = 'Desconectado';
                                statusEl.style.color = '#9ca3af';
                            }
                        }
                    }, 35000); // 35 seconds (TEST MODE)
                }

                // Update header immediately if chatting with this user
                if (window.currentChatOtherUserId && window.currentChatOtherUserId == data.user_id) {
                    const statusEl = document.getElementById('chat-status');
                    if (statusEl) {
                        statusEl.innerText = (data.status === 'online') ? 'En línea' : 'Desconectado';
                        statusEl.style.color = (data.status === 'online') ? '#22c55e' : '#9ca3af';
                    }
                }
            }
        };

        presenceSocket.onclose = function () {
            setTimeout(connectToPresence, 5000);
        };
    }

    function updateUserStatusInList(userId, status) {
        // Always update cache so when contact list loads later it gets the right status
        presenceCache[userId] = status;

        console.log('[Presence] Updating user', userId, 'to status:', status);
        const item = document.querySelector(`.contact-list-item[data-user-id="${userId}"]`);
        if (item) {
            const indicator = item.querySelector('.status-indicator');
            if (indicator) {
                if (status === 'online') {
                    indicator.classList.remove('bg-secondary');
                    indicator.classList.add('bg-success');
                } else {
                    indicator.classList.remove('bg-success');
                    indicator.classList.add('bg-secondary');
                }
                console.log('[Presence] Updated indicator for user', userId, 'to', status);
            }
        }
    }

    // Apply cached presence statuses to all contact list items
    function applyPresenceCacheToList() {
        console.log('[Presence] Applying cache to contact list:', presenceCache);
        Object.entries(presenceCache).forEach(([userId, status]) => {
            const item = document.querySelector(`.contact-list-item[data-user-id="${userId}"]`);
            if (item) {
                const indicator = item.querySelector('.status-indicator');
                if (indicator) {
                    if (status === 'online') {
                        indicator.classList.remove('bg-secondary');
                        indicator.classList.add('bg-success');
                    } else {
                        indicator.classList.remove('bg-success');
                        indicator.classList.add('bg-secondary');
                    }
                }
            }
        });
    }

    // When HTMX renders the contact list, apply the cached presence statuses
    document.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail && e.detail.target && e.detail.target.id === 'chat-content-area') {
            setTimeout(applyPresenceCacheToList, 100);
        }
    });

    // Mapa para cancelar reconexiones pendientes al cambiar de chat
    let reconnectTimer = null;

    function connectToChat(chatId) {
        if (!chatId) {
            console.error('ERROR: Chat ID no válido:', chatId);
            return;
        }

        // Cancelar cualquier reconexión pendiente del chat anterior
        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }

        // Si ya estamos en este mismo chat y el socket está abierto, no hacer nada
        if (activeChatSocketId === chatId && chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            console.log('Ya conectado al chat:', chatId);
            return;
        }

        // Guardar el chatId ANTES de cerrar el socket anterior
        // para que su onclose sepa que ya no debe reconectar
        const previousChatId = activeChatSocketId;
        activeChatSocketId = chatId;

        // Cerrar el socket anterior si existe
        if (chatSocket) {
            const oldSocket = chatSocket;
            chatSocket = null; // Desconectar la referencia global primero
            oldSocket.onclose = null; // Evitar que dispare reconexión
            oldSocket.onerror = null;
            oldSocket.onmessage = null;
            try { oldSocket.close(); } catch(e) {}
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/chat/${chatId}/`;
        
        console.log('Conectando WebSocket a:', wsUrl, '(chatId:', chatId, ')');

        const currentSocket = new WebSocket(wsUrl);
        chatSocket = currentSocket;

        let chatHeartbeat = null;

        currentSocket.onopen = function (e) {
            // Verificar que este socket siga siendo el activo
            if (chatSocket !== currentSocket) { currentSocket.close(); return; }
            console.log('Chat socket connected a chatId:', chatId);

            // Solo marcar como leído si el panel está visible/abierto
            const panel = document.getElementById('message-panel');
            if (panel && panel.classList.contains('active')) {
                currentSocket.send(JSON.stringify({ 'action': 'read_messages' }));
            }

            // Ping cada 30 segundos para mantener el WebSocket vivo
            chatHeartbeat = setInterval(function() {
                if (chatSocket === currentSocket && currentSocket.readyState === WebSocket.OPEN) {
                    currentSocket.send(JSON.stringify({ 'action': 'heartbeat' }));
                } else {
                    clearInterval(chatHeartbeat);
                }
            }, 30000);
        };

        currentSocket.onmessage = function (e) {
            // Ignorar mensajes de sockets ya reemplazados
            if (chatSocket !== currentSocket) return;

            const data = JSON.parse(e.data);
            console.log('Chat message received (chatId ' + chatId + '):', data.type);

            if (data.type === 'chat_message') {
                renderIncomingMessage(data);
                if (typeof updateLastSentStatus === 'function') {
                    updateLastSentStatus();
                }
                if (data.user_id != currentUserId) {
                    currentSocket.send(JSON.stringify({ action: 'message_received', message_id: data.message_id }));
                }
            } else if (data.type === 'chat_read_receipt') {
                handleReadReceipt(data);
            } else if (data.type === 'chat_delivered_receipt') {
                handleDeliveredReceipt(data);
            } else if (data.type === 'user_typing') {
                handleTypingIndicator(data);
            }
        };

        currentSocket.onerror = function (e) {
            if (chatSocket !== currentSocket) return;
            console.error('Chat socket error:', e);
        };

        currentSocket.onclose = function (e) {
            if (chatHeartbeat) clearInterval(chatHeartbeat);
            // Solo reconectar si este socket sigue siendo el activo para este chatId
            if (chatSocket === currentSocket && activeChatSocketId === chatId) {
                chatSocket = null;
                console.warn('Chat socket closed (code ' + e.code + '). Reconectando en 2s...');
                reconnectTimer = setTimeout(function() {
                    reconnectTimer = null;
                    if (activeChatSocketId === chatId) {
                        connectToChat(chatId);
                    }
                }, 2000);
            }
        };
    }

    function handleReadReceipt(data) {
        const readerId = parseInt(data.user_id);
        console.log("Read receipt from:", readerId, "My ID:", currentUserId);

        if (readerId === currentUserId) {
            console.log("I am the one who read the messages. Ignoring.");
            return;
        }

        // The OTHER person read my messages
        console.log("Updating all my sent messages to 'Visto'...");
        const sentMessages = document.querySelectorAll('.message-status.status-sent');
        console.log("Found sent messages:", sentMessages.length);

        sentMessages.forEach(el => {
            const isImage = el.closest('.message-bubble').style.background === 'transparent';
            el.innerHTML = '<i class="fas fa-check-double"></i> Visto';
            el.style.color = isImage ? '#0084ff' : '#d1f2ff';
            el.style.fontWeight = 'bold';
        });

        if (typeof updateLastSentStatus === 'function') {
            updateLastSentStatus();
        }
    }

    function handleDeliveredReceipt(data) {
        const readerId = parseInt(data.user_id);
        if (readerId === currentUserId) return;

        const sentMessages = document.querySelectorAll('.message-status.status-sent');
        sentMessages.forEach(el => {
            if (el.innerText.includes('Enviado')) {
                const isImage = el.closest('.message-bubble').style.background === 'transparent';
                el.innerHTML = '<i class="fas fa-check-double"></i> Recibido';
                el.style.color = isImage ? '#666' : '#a0a0a0';
            }
        });
    }

    function handleTypingIndicator(data) {
        // Implement typing indicator logic here if needed
    }

    function renderIncomingMessage(data) {
        const container = document.getElementById('messages-container');
        if (!container) {
            console.warn('WARN: messages-container no encontrado');
            return;
        }

        // Remove 'no messages' placeholder if exists
        const noMsg = document.getElementById('no-messages-placeholder');
        if (noMsg) noMsg.remove();

        const senderId = parseInt(data.user_id);
        const isMe = (senderId === currentUserId);
        console.log(`Render message: sender=${senderId}, current=${currentUserId}, isMe=${isMe}`);

        let bubbleContent = '';
        if (data.tipo === 'imagen') {
            bubbleContent = `<img src="${data.image_url}" class="img-fluid rounded-2 mb-1" style="max-height: 250px; cursor: pointer; border: 3px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1);" onclick="window.open('${data.image_url}', '_blank')">`;
        } else if (data.tipo === 'story_reply') {
            let storyHtml = '';
            if (data.story_url) {
                storyHtml = `<img src="${data.story_url}" style="width: 40px; height: 60px; object-fit: cover; border-radius: 4px;">`;
            } else {
                storyHtml = `<div style="width: 40px; height: 60px; background: ${data.story_color || '#4f46e5'}; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden;"><span class="text-white text-center" style="font-size: 0.4rem; padding: 2px;"></span></div>`;
            }
            bubbleContent = `
                <div class="story-reply-preview mb-2 p-2 rounded" style="background: rgba(0,0,0,0.1); border-left: 3px solid ${isMe ? '#fff' : '#0084ff'};">
                    <small class="d-block mb-1" style="opacity: 0.8; font-size: 0.75rem;"><i class="fas fa-reply"></i> Respondió a la historia</small>
                    <div class="d-flex align-items-center gap-2" style="cursor: pointer;" onclick="if(typeof abrirVisorStories === 'function') abrirVisorStories('${data.story_usuario_id}', '${data.story_id}');">
                        ${storyHtml}
                        <div class="text-truncate small flex-grow-1" style="max-width: 150px; opacity: 0.9;">
                            Historia
                        </div>
                    </div>
                </div>
                <div class="message-text" style="word-wrap: break-word;">${data.message}</div>
            `;
        } else {
            bubbleContent = `<div class="message-text" style="word-wrap: break-word;">${data.message}</div>`;
        }

        const msgHtml = `
            <div class="message mb-2 d-flex ${isMe ? 'justify-content-end' : ''}">
                <div class="message-bubble p-2 rounded-3 shadow-sm" 
                     style="max-width: 80%; ${data.tipo === 'imagen' ? 'background: transparent; box-shadow: none !important;' : (isMe ? 'background: #0084ff; color: white;' : 'background: white; color: #1c1e21;')}">
                    ${bubbleContent}
                    <div class="d-flex justify-content-between align-items-center mt-1" style="font-size: 0.7rem; opacity: 0.9; ${data.tipo === 'imagen' ? 'color: #666;' : ''}">
                        ${isMe ? `
                        <div class="message-status status-sent me-2" style="color: ${data.tipo === 'imagen' ? '#666' : '#e0e0e0'}">
                            <i class="fas fa-check"></i> Enviado
                        </div>` : ''}
                        <div class="local-time" data-utc="${data.timestamp}"></div>
                    </div>
                </div>
            </div>
        `;

        try {
            const isNearBottom = container && Math.abs(container.scrollTop) < 100;
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.insertAdjacentHTML('afterend', msgHtml);
            } else {
                container.insertAdjacentHTML('afterbegin', msgHtml);
            }
            container.scrollTop = 0; // Con column-reverse, 0 es el fondo visible
            formatLocalTime();

            // Si es un mensaje entrante y estamos viendo la parte inferior del chat, lo marcamos como leído automáticamente.
            const panel = document.getElementById('message-panel');
            const isPanelOpen = panel && panel.classList.contains('active');
            if (!isMe && isNearBottom && isPanelOpen && typeof window.markChatAsRead === 'function') {
                window.markChatAsRead();
            }
        } catch (error) {
            console.error('ERROR al renderizar mensaje:', error);
        }

        if (typeof updateLastSentStatus === 'function') {
            updateLastSentStatus();
        }

        // --- REAL-TIME SIDEBAR UPDATE ---
        // 1. Find the other user (if I'm receiving, it's the sender; if I'm sending, it's the recipient)
        // Note: For now, let's assume we can find the sidebar item by some attribute.
        // This part requires access to the contact list DOM which is outside this loop scope usually
        // But we can trigger a refresh via HTMX if needed or modify DOM directly
        const otherId = isMe ? window.currentChatOtherUserId : senderId;
        const contactItem = document.querySelector(`.contact-list-item[data-user-id="${otherId}"]`);

        if (contactItem) {
            // Move to top
            const listContainer = document.getElementById('contact-list-container');
            if (listContainer) {
                listContainer.prepend(contactItem);
            }

            // Update preview text
            const previewEl = contactItem.querySelector('.small.text-truncate');
            if (previewEl) {
                previewEl.innerText = isMe ? `Tú: ${data.message || 'Imagen'}` : (data.message || 'Imagen');
                previewEl.style.fontWeight = 'bold';
                previewEl.style.color = '#1f2937';
            }

            // Update time
            const timeEl = contactItem.querySelector('.local-time');
            if (timeEl) {
                timeEl.dataset.utc = data.timestamp;
                delete timeEl.dataset.formatted;
            }
        }
        
        formatLocalTime();
    }

    // Init presence
    if (document.getElementById('current-user-id')) {
        connectToPresence();
    }

    function highlightContact(el, userId) {
        // Remove notification badge if present
        const badge = el.querySelector('.badge');
        if (badge) badge.remove();

        // Reset preview font weight
        const previewEl = el.querySelector('.small.text-truncate');
        if (previewEl) {
            previewEl.style.fontWeight = 'normal';
            previewEl.style.color = '#6b7280';
        }

        // Update active class in list items
        document.querySelectorAll('.contact-list-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');

        // Store current other user ID for reordering logic
        window.currentChatOtherUserId = userId;
    }

    // Escuchar evento que dispara chat_window.html cuando ya está en el DOM
    // para conectar el WebSocket al chat correcto
    document.addEventListener('chat:connect', function(e) {
        const chatId = e.detail && e.detail.chatId;
        if (chatId) {
            console.log('[floating_chat] Evento chat:connect recibido, chatId:', chatId);
            connectToChat(chatId);
        }
    });

    // ================================================================
    // === LLAMADAS DE AUDIO WebRTC ===================================
    // ================================================================

    let callSocket = null;
    let peerConnection = null;
    let localStream = null;
    let currentCallData = null;
    let callTimerInterval = null;
    let callStartTime = null;
    let isMuted = false;
    let isSpeakerOff = false;

    const ICE_SERVERS = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
        ]
    };

    // --- Conectar WebSocket de llamadas ---
    function connectCallSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        callSocket = new WebSocket(`${protocol}//${window.location.host}/ws/call/`);

        callSocket.onopen = () => console.log('[Call WS] Conectado');

        callSocket.onmessage = function(e) {
            try {
                const data = JSON.parse(e.data);
                console.log('[Call WS] Recibido:', data.action);
                switch(data.action) {
                    case 'incoming_call':  handleIncomingCall(data);  break;
                    case 'call_accepted':  handleCallAccepted(data);  break;
                    case 'call_rejected':  handleCallRejected();       break;
                    case 'call_offer':     handleCallOffer(data);      break;
                    case 'call_answer':    handleCallAnswer(data);     break;
                    case 'ice_candidate':  handleIceCandidate(data);   break;
                    case 'end_call':       handleRemoteEndCall();       break;
                }
            } catch(err) { console.error('[Call WS] Parse error:', err); }
        };

        callSocket.onclose = () => {
            console.warn('[Call WS] Cerrado. Reconectando en 3s...');
            setTimeout(connectCallSocket, 3000);
        };
        callSocket.onerror = (e) => console.error('[Call WS] Error:', e);
    }

    // --- Helper: enviar por callSocket ---
    function callSend(obj) {
        if (callSocket && callSocket.readyState === WebSocket.OPEN) {
            callSocket.send(JSON.stringify(obj));
        } else {
            console.error('[Call] Socket no disponible, readyState:', callSocket && callSocket.readyState);
        }
    }

    // --- Iniciar llamada (llamante) ---
    window.startCall = function(targetUserId, peerName, peerPhoto) {
        if (!callSocket || callSocket.readyState !== WebSocket.OPEN) {
            alert('Conectando al servicio de llamadas, intenta en un momento...');
            return;
        }
        currentCallData = { target_user_id: targetUserId, peer_name: peerName.trim() || 'Usuario', peer_photo: peerPhoto, is_caller: true };
        callSend({ action: 'initiate_call', target_user_id: targetUserId });
        showActiveCallUI(currentCallData.peer_name, currentCallData.peer_photo);
        document.getElementById('call-status-label').textContent = 'Llamando...';
    };

    // --- Llamada entrante (receptor) ---
    function handleIncomingCall(data) {
        currentCallData = {
            llamada_id: data.llamada_id,
            target_user_id: data.caller_id,
            peer_name: data.caller_name || data.caller_username || 'Usuario',
            peer_photo: data.caller_photo,
            is_caller: false,
        };
        const overlay = document.getElementById('incoming-call-overlay');
        document.getElementById('incoming-caller-name').textContent = currentCallData.peer_name;
        const photoEl = document.getElementById('incoming-caller-photo');
        const iconEl  = document.getElementById('incoming-caller-icon');
        if (data.caller_photo) {
            photoEl.src = data.caller_photo;
            photoEl.style.display = 'block';
            iconEl.style.display = 'none';
        }
        overlay.style.display = 'block';
        try { document.getElementById('call-ringtone').play(); } catch(e) {}
    }

    // --- Receptor acepta ---
    window.acceptCall = async function() {
        try {
            console.log('[Call] Aceptando llamada...');
            document.getElementById('incoming-call-overlay').style.display = 'none';
            try { const r = document.getElementById('call-ringtone'); r.pause(); r.currentTime = 0; } catch(e) {}

            // Notificar al llamante
            callSend({
                action: 'call_accepted',
                target_user_id: currentCallData.target_user_id,
                llamada_id: currentCallData.llamada_id,
            });

            // Obtener micro del receptor
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Tu navegador no soporta llamadas de audio en esta conexión (¿estás usando HTTP en vez de HTTPS?).");
                }
                localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                console.log('[Call] Stream local obtenido');
            } catch(err) {
                console.error('[Call] Error al acceder al micrófono:', err);
                alert('Error de micrófono: ' + err.message);
                callSend({ action: 'end_call', target_user_id: currentCallData.target_user_id, llamada_id: currentCallData.llamada_id, duracion: 0 });
                currentCallData = null;
                cleanupCall();
                return;
            }

            showActiveCallUI(currentCallData.peer_name, currentCallData.peer_photo);
            createPeerConnection();
        } catch (e) {
            alert("Error en acceptCall: " + e.message);
        }
    };

    // --- Receptor rechaza ---
    window.rejectCall = function() {
        try {
            document.getElementById('incoming-call-overlay').style.display = 'none';
            try { const r = document.getElementById('call-ringtone'); r.pause(); r.currentTime = 0; } catch(e) {}
            if (currentCallData) {
                callSend({ action: 'call_rejected', target_user_id: currentCallData.target_user_id, llamada_id: currentCallData.llamada_id });
            }
            currentCallData = null;
        } catch (e) {
            alert("Error en rejectCall: " + e.message);
        }
    };

    // --- Llamante: receptor aceptó → obtener micro y enviar offer ---
    async function handleCallAccepted(data) {
        try {
            console.log('[Call] Receptor aceptó, obteniendo micrófono...');
            currentCallData.llamada_id = data.llamada_id;

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Navegador no soporta audio en esta conexión.");
                }
                localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                console.log('[Call] Stream local del llamante obtenido');
            } catch(err) {
                console.error('[Call] Error al acceder al micrófono:', err);
                alert('Error de micrófono: ' + err.message);
                cleanupCall();
                return;
            }

            createPeerConnection();

            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                callSend({ action: 'call_offer', target_user_id: currentCallData.target_user_id, sdp: peerConnection.localDescription });
                console.log('[Call] Offer enviado');
            } catch(err) {
                console.error('[Call] Error creando offer:', err);
                alert('Error de conexión: ' + err.message);
            }
        } catch(e) {
            alert("Error en handleCallAccepted: " + e.message);
        }
    }

    // --- Receptor: recibir offer y responder ---
    async function handleCallOffer(data) {
        console.log('[Call] Offer recibido, creando answer...');
        if (!peerConnection) createPeerConnection();
        try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            callSend({ action: 'call_answer', target_user_id: currentCallData.target_user_id, sdp: peerConnection.localDescription });
            console.log('[Call] Answer enviado');
        } catch(err) {
            console.error('[Call] Error en handleCallOffer:', err);
        }
    }

    // --- Llamante: recibir answer ---
    async function handleCallAnswer(data) {
        console.log('[Call] Answer recibido');
        try {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        } catch(err) {
            console.error('[Call] Error en handleCallAnswer:', err);
        }
    }

    // --- ICE candidate ---
    async function handleIceCandidate(data) {
        if (data.candidate && peerConnection) {
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch(e) { console.error('[ICE] Error:', e); }
        }
    }

    // --- Colgar (local) ---
    window.endCall = function() {
        if (currentCallData) {
            const duracion = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
            callSend({ action: 'end_call', target_user_id: currentCallData.target_user_id, llamada_id: currentCallData.llamada_id, duracion: duracion });
        }
        cleanupCall();
    };

    function handleRemoteEndCall() { cleanupCall(); }

    function handleCallRejected() {
        document.getElementById('call-status-label').textContent = 'Llamada rechazada';
        setTimeout(cleanupCall, 1500);
    }

    // --- Crear RTCPeerConnection (audio only) ---
    function createPeerConnection() {
        peerConnection = new RTCPeerConnection(ICE_SERVERS);

        // Agregar tracks de audio local
        if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }

        // Relay ICE candidates
        peerConnection.onicecandidate = (e) => {
            if (e.candidate && currentCallData) {
                callSend({ action: 'ice_candidate', target_user_id: currentCallData.target_user_id, candidate: e.candidate });
            }
        };

        // Audio remoto → reproducir
        peerConnection.ontrack = (e) => {
            console.log('[Call] Track remoto recibido');
            const remoteAudio = document.getElementById('remote-audio');
            if (remoteAudio && e.streams[0]) {
                remoteAudio.srcObject = e.streams[0];
                document.getElementById('call-status-label').textContent = 'En llamada';
                callStartTime = Date.now();
                startCallTimer();
            }
        };

        peerConnection.onconnectionstatechange = () => {
            console.log('[Call] Estado de conexión:', peerConnection.connectionState);
            if (peerConnection.connectionState === 'connected') {
                document.getElementById('call-status-label').textContent = 'En llamada';
            } else if (['disconnected','failed','closed'].includes(peerConnection.connectionState)) {
                cleanupCall();
            }
        };
    }

    // --- Mostrar UI de llamada activa ---
    function showActiveCallUI(peerName, peerPhoto) {
        document.getElementById('active-call-overlay').style.display = 'block';
        document.getElementById('call-peer-name').textContent = peerName;
        const photoEl = document.getElementById('call-peer-photo');
        const iconEl  = document.getElementById('call-peer-icon');
        if (peerPhoto) {
            photoEl.src = peerPhoto;
            photoEl.style.display = 'block';
            iconEl.style.display = 'none';
        }
    }

    function startCallTimer() {
        const timerEl = document.getElementById('call-timer');
        callTimerInterval = setInterval(() => {
            if (!callStartTime) return;
            const secs = Math.floor((Date.now() - callStartTime) / 1000);
            const m = String(Math.floor(secs / 60)).padStart(2, '0');
            const s = String(secs % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
        }, 1000);
    }

    // --- Limpiar todo ---
    function cleanupCall() {
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        const ra = document.getElementById('remote-audio'); if (ra) ra.srcObject = null;
        document.getElementById('active-call-overlay').style.display = 'none';
        document.getElementById('incoming-call-overlay').style.display = 'none';
        try { const r = document.getElementById('call-ringtone'); r.pause(); r.currentTime = 0; } catch(e) {}
        if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
        callStartTime = null;
        currentCallData = null;
        isMuted = false; isSpeakerOff = false;
        const muteIcon = document.getElementById('mute-icon');
        const muteBtn  = document.getElementById('btn-mute');
        if (muteIcon) muteIcon.className = 'fas fa-microphone';
        if (muteBtn)  muteBtn.style.background = 'rgba(255,255,255,0.12)';
        const timerEl = document.getElementById('call-timer');
        if (timerEl) timerEl.textContent = '';
        const statusEl = document.getElementById('call-status-label');
        if (statusEl) statusEl.textContent = 'Conectando...';
    }

    window.toggleMute = function() {
        if (!localStream) {
            console.warn('[Call] No localStream found to mute');
            return;
        }
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        document.getElementById('mute-icon').className = isMuted ? 'fas fa-microphone-slash' : 'fas fa-microphone';
        document.getElementById('btn-mute').style.background = isMuted ? 'rgba(239,68,68,0.5)' : 'rgba(255,255,255,0.12)';
    };

    // Inicializar al cargar
    connectCallSocket();

</script>
