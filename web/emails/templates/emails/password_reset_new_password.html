<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | Milanesa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">
                <div class="card login-card p-4 animate-fade-in">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <!-- Logo -->
                            <img src="{% static 'logo/logo.png' %}" alt="Milanesa Logo" class="mb-3"
                                style="max-height: 80px; width: auto; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));">

                            <div class="brand-title text-uppercase mb-2">SEGURIDAD</div>
                            <h2 class="fw-bold page-title">Nueva Contraseña</h2>
                            <p class="text-muted small mt-2">Introduce tu nueva contraseña para actualizarla en el sistema.</p>
                        </div>

                        {% if messages %}
                        <div class="alert alert-danger animate-fade-in mb-3" role="alert">
                            {% for message in messages %}
                            {{ message }}
                            {% endfor %}
                        </div>
                        {% endif %}

                        <form method="POST" autocomplete="off">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="id_password" class="form-label fw-medium">Contraseña Nueva</label>
                                <input type="password" class="form-control form-control-lg" id="id_password" name="password"
                                    placeholder="Mínimo 8 caracteres" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="id_confirm_password" class="form-label fw-medium">Confirmar Contraseña</label>
                                <input type="password" class="form-control form-control-lg" id="id_confirm_password" name="confirm_password"
                                    placeholder="Repite la contraseña" required>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-black btn-lg">
                                    Restablecer Contraseña
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
